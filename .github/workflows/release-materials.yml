name: Release materials

# Central copy: pick the SOURCE repo in this course org, then the path(s) to copy into
# the cohort org. source_path and dest_path are comma-separated parallel lists paired
# by index - leave dest_path blank to mirror source_path. These are exactly a
# schedule.yml `deploy:` entry's fields.
# Dropdowns are refreshed by the 'Refresh actions' workflow.

on:
  workflow_dispatch:
    inputs:
      cohort_org:
        description: "Target cohort org"
        required: true
        type: choice
        options:
          - DSL-Demo-f2025
          - DSL-Demo-f2026
          - DSL-Demo-f2027
      source_repo:
        description: "source_repo - repo in the COURSE org"
        required: true
        type: choice
        options:
          - course-materials-f2025
          - course-materials-f2026
          - lecture-code-f2026
      source_path:
        description: "source_path - folder/file, or a comma-separated list"
        required: true
      dest_repo:
        description: "dest_repo - repo in the cohort org (created if missing)"
        required: false
        default: materials
      dest_path:
        description: "dest_path - blank = mirror source_path"
        required: false

jobs:
  check-team:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Verify the user may run actions for THIS repo
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          # Faculty & instructors have write+ on the course repos; students never do (and triggering a
          # workflow_dispatch already requires write), so repo permission is the gate.
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/tmp/gherr || true)
          case "$perm" in admin|write|maintain) exit 0 ;; esac
          echo "::error::@$ACTOR lacks write on $REPO (permission='$perm'). gh api said:"
          cat /tmp/gherr || true
          exit 1

  release:
    needs: check-team
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hertie-data-science-lab/dsl-teaching-course-setup
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          SRC_ORG: ${{ github.repository_owner }}
          SRC_REPO: ${{ inputs.source_repo }}
          COHORT_ORG: ${{ inputs.cohort_org }}
          SRC_PATH: ${{ inputs.source_path }}
          DEST_REPO: ${{ inputs.dest_repo }}
          DEST_PATH: ${{ inputs.dest_path }}
        run: |
          gh auth setup-git
          python3 -m dsl_course.deploy --source-org "$SRC_ORG" \
            --source-repo "$SRC_REPO" --cohort-org "$COHORT_ORG" \
            --source-path "$SRC_PATH" --dest-repo "$DEST_REPO" \
            --dest-path "$DEST_PATH"
